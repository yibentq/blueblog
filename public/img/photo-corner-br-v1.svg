<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 38 38" width="38" height="38">
  <!-- 相角（相册里压住照片四角的那种小三角）。斜边不是直线——手工拉了一点弧，两条直角边也不等长；
       靛蓝小牛皮色，斜边一线亮边（皮革切口），光源永远在左上：四个方向的阴影方向一致，只镜像了形状。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#163E6B"/><stop offset="1" stop-color="#0B1F35"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx=".7" dy="1.3" stdDeviation=".9" flood-color="#2a1a06" flood-opacity=".55"/></filter>
  </defs>
  <g filter="url(#s)"><g transform="translate(30 30) scale(-1 -1)">
    <path d="M0 0 L27.6 0 C21.2 5.4 15.2 10.6 12.9 13.1 C10.6 15.4 5.6 21 0 26.8 Z" fill="url(#g)"/>
    <path d="M27.6 0 C21.2 5.4 15.2 10.6 12.9 13.1 C10.6 15.4 5.6 21 0 26.8" fill="none" stroke="#EAF0F8" stroke-opacity=".38" stroke-width=".7" stroke-linecap="round"/>
  </g></g>
</svg>
