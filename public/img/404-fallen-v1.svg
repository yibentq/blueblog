<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 256" width="320" height="256" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- 404 插画：图挂丢了。墙上只剩一个空相框（歪着挂）和四个图钉孔，那张图掉在地上。
       全部手工定的控制点：相框四边故意不严格平行，像手扶着画的；画面里一切用站点自己的三个颜色（铜 / 蓝晒蓝 / 线白）。 -->
  <g transform="rotate(-3.5 160 104)">
    <!-- 吊线与钉子 -->
    <path d="M113 38 L160 11 L207 37" stroke="#EAF0F8" stroke-opacity=".5" stroke-width="1.1"/>
    <circle cx="160" cy="10" r="2.6" fill="#C79A45" stroke="none"/>
    <circle cx="159.2" cy="9.2" r=".9" fill="#F6EFE0" stroke="none" opacity=".8"/>
    <!-- 外框、内框、卡纸窗口 -->
    <path d="M90 36 L230 33.5 L233.5 175 L87.5 178 Z" stroke="#C79A45" stroke-width="2.4"/>
    <path d="M99.5 46.5 L221 45 L223.2 165 L98 167.4 Z" stroke="#C79A45" stroke-opacity=".7" stroke-width="1.1"/>
    <path d="M111 58.5 L209 57.5 L210.6 153.5 L110 155 Z" stroke="#EAF0F8" stroke-opacity=".45" stroke-width="1"/>
    <!-- 原来那张图的\"影子\"：墙没被晒到的地方比周围略亮，四角是图钉孔 -->
    <path d="M118 66 L202 65 L203.4 146 L117 147.2 Z" fill="#EAF0F8" fill-opacity=".07" stroke="none"/>
    <g fill="#061224" fill-opacity=".85" stroke="#EAF0F8" stroke-opacity=".5" stroke-width=".8">
      <circle cx="118" cy="66" r="1.7"/><circle cx="202" cy="65" r="1.7"/>
      <circle cx="203.4" cy="146" r="1.7"/><circle cx="117" cy="147.2" r="1.7"/>
    </g>
    <!-- 玻璃反光：两道斜线，说明相框里是空的、只剩玻璃 -->
    <path d="M176 60 L150 150" stroke="#EAF0F8" stroke-opacity=".16" stroke-width="5"/>
    <path d="M192 62 L173 118" stroke="#EAF0F8" stroke-opacity=".12" stroke-width="2.4"/>
  </g>
  <!-- 地面 -->
  <path d="M26 242 L296 241" stroke="#EAF0F8" stroke-opacity=".28" stroke-width="1"/>
  <!-- 掉在地上的那张图：拍立得式白边，蓝晒蓝底，白线的山和日头；右下角卷起一角 -->
  <ellipse cx="206" cy="241" rx="52" ry="4.5" fill="#000" fill-opacity=".28" stroke="none"/>
  <g transform="rotate(11 204 214)">
    <path d="M172 190 L236 189 L237.5 236 L171 236.6 Z" fill="#EAF0F8" fill-opacity=".93" stroke="none"/>
    <path d="M177 195 L231 194.4 L231.6 224 L176.4 224.6 Z" fill="#1D4E89" stroke="none"/>
    <path d="M177 218 L188 206.5 L195 213 L208 200.5 L231.6 220" stroke="#EAF0F8" stroke-width="1.4"/>
    <circle cx="219" cy="203" r="3.2" stroke="#EAF0F8" stroke-width="1.2"/>
    <path d="M237.5 236 L224 236.4 L237.2 223 Z" fill="#C9D3E2" stroke="#9AA8BF" stroke-width=".6"/>
  </g>
</svg>
